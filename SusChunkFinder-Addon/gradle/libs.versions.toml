[versions]
jdk = "21"
minecraft = "1.21.11"
yarn = "1.21.11+build.1"
fabric-loader = "0.18.1"
fabric-api = "0.139.5+1.21.11"

# Plugins
loom = "1.14"

# Mods
meteor = "1.21.11-SNAPSHOT"
orbit = "0.2.4"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
yarn = { module = "net.fabricmc:yarn", version.ref = "yarn" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
meteor = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }
orbit = { module = "meteordevelopment:orbit", version.ref = "orbit" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
